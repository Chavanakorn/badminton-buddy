<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>สุ่มทีมคู่แบดมินตัน - Badminton Buddy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="version" content="1.2.0">
    <meta name="description" content="เว็บสำหรับสุ่มทีมแบดมินตันอัตโนมัติ">
    <meta name="keywords" content="แบดมินตัน, สุ่มทีม, Badminton, ทีมคู่, กีฬา">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="header">
    <div class="logo">
        <div class="logo-icon">🏸</div>
        <h1>Badminton Buddy</h1>
    </div>
    <span class="version-badge">V.1.2.0</span>
</div>

<div class="container">
    <h2><span class="material-symbols-rounded">person_add</span>เพิ่มสมาชิก</h2>
    <div class="input-group">
        <input type="text" id="memberName" placeholder="พิมพ์ชื่อสมาชิก..." onkeypress="if(event.key==='Enter')addMember()">
        <button class="btn-add" onclick="addMember()">
            <span class="material-symbols-rounded">add</span>
            เพิ่ม
        </button>
    </div>
    <div id="memberList">
        <h2>
            <span class="material-symbols-rounded">groups</span>
            รายชื่อสมาชิก
            <span class="member-count" id="memberCount">0</span>
        </h2>
        <ul id="members"></ul>
        <div class="empty-state" id="emptyState">
            <span class="material-symbols-rounded">person_off</span>
            <p>ยังไม่มีสมาชิก</p>
        </div>
    </div>
</div>

<button id="generateButton" onclick="generateMatches()">
    <span class="material-symbols-rounded">shuffle</span>
    สุ่มทีม
</button>

<div class="container">
    <h2><span class="material-symbols-rounded">sports</span>แมทช์ที่สุ่มได้</h2>
    <ul id="matches"></ul>
    <div class="empty-state" id="matchEmptyState">
        <span class="material-symbols-rounded">sports_tennis</span>
        <p>กดปุ่ม "สุ่มทีม" เพื่อจับคู่</p>
    </div>
</div>

<!-- Toast notification -->
<div id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
